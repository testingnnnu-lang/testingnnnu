<style>

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
  .stat{background:var(--soft);border-radius:12px;padding:12px}

  button{font:inherit;font-weight:600;border:none;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--blue);color:#fff}
  button.sec{background:var(--soft);color:var(--text)}
  button.small{padding:6px 12px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  .full{width:100%;margin-top:12px}
  .row{display:flex;gap:10px;margin-top:12px}
  .row>*{flex:1}
  input{width:100%;padding:12px;font-size:16px;border:1px solid #d5d9e3;border-radius:10px;margin-top:6px}
  label{display:block;font-size:14px;margin-top:12px}
  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .lv{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;background:#fff;text-align:left;color:var(--text);font-weight:500;min-height:64px}
  .lv b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
  .lv.done{border-color:#bbf7d0;background:#f0fdf4}
  .lv.cur{border-color:var(--blue);background:#eff5ff;box-shadow:0 0 0 2px #c7d8ff}
  .lv.lock,.lv.soon{opacity:.55;cursor:default}
  pre{background:var(--code);color:#e2e8f0;padding:14px;border-radius:10px;overflow-x:auto;font-size:14px;line-height:1.5;margin:12px 0;white-space:pre}
  code,.mono{font-family:ui-monospace,Consolas,Menlo,monospace}
  .flash{min-height:240px;border:2px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;background:#fff;user-select:none}
  .flash.back{border-color:var(--blue);background:#f8fbff}
  .flash .tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .flash .front{font-size:20px;font-weight:700}
  .flash .txt{white-space:pre-line;font-size:16px}
  .opt{display:flex;align-items:center;width:100%;text-align:left;background:#fff;color:var(--text);border:2px solid var(--line);margin:8px 0;font-weight:500;font-family:ui-monospace,Consolas,Menlo,monospace}

  .opt.wrong{border-color:var(--red);background:#fef2f2}
  .fb{border-radius:12px;padding:14px;margin-top:12px;font-size:15px}
  .fb.ok{background:#f0fdf4;border:1px solid #bbf7d0}
  .fb.no{background:#fef2f2;border:1px solid #fecaca}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
  .timer{font-weight:700;font-variant-numeric:tabular-nums}
  .chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;background:var(--soft);margin:3px 4px 3px 0}
  .big{font-size:46px;font-weight:800;margin:4px 0}
  .rev{border-top:1px solid var(--line);padding:12px 0}
  .hidden{display:none}
  .msg{min-height:20px;font-size:14px;margin-top:12px}

// Build 4 unique options with the correct one first
function numOpts(correct, cands) {
  const out = [String(correct)], seen = new Set(out);
  for (const c of cands) { const v = String(c); if (!seen.has(v)) { seen.add(v); out.push(v); } if (out.length === 4) break; }

}

const CONTENT_MAX = Math.max(...Object.keys(C).map(Number));

// =====================================================================
// 5. LEARNER STATE + MERGING (so an old device never overwrites newer progress)
// =====================================================================
const blank = () => ({ v: 1, completed: {}, best: {}, seen: {}, attempts: [], wrong: [], wrongCleared: 0, daily: {}, resume: null });
function normState(s) { const b = blank(); if (!s || typeof s !== 'object') return b; for (const k in b) if (s[k] !== undefined && s[k] !== null) b[k] = s[k]; if (s.resume) b.resume = s.resume; return b; }
const keysOf = (a, b) => new Set([...Object.keys(a), ...Object.keys(b)]);
function merge(a, b) {
  a = normState(a); b = normState(b); const m = blank();
  m.completed = { ...a.completed, ...b.completed };                                     // completed on either device = completed
  for (const k of keysOf(a.best, b.best)) m.best[k] = Math.max(a.best[k] ?? 0, b.best[k] ?? 0);  // keep best score
  for (const k of keysOf(a.seen, b.seen)) {                                             // question history per level
    const x = a.seen[k] || { r: 0, ids: [] }, y = b.seen[k] || { r: 0, ids: [] };
    m.seen[k] = x.r > y.r ? x : y.r > x.r ? y : { r: x.r, ids: [...new Set([...x.ids, ...y.ids])] };
  }
  const at = new Map(); [...a.attempts, ...b.attempts].forEach(t => at.set(t.id, t));
  m.attempts = [...at.values()].sort((p, q) => p.d - q.d).slice(-300);
  m.wrongCleared = Math.max(a.wrongCleared, b.wrongCleared);
  const wr = new Map(); [...a.wrong, ...b.wrong].forEach(w => wr.set(w.id + '|' + w.d, w));
  m.wrong = [...wr.values()].filter(w => w.d > m.wrongCleared).sort((p, q) => p.d - q.d).slice(-50);
  for (const k of keysOf(a.daily, b.daily)) m.daily[k] = Math.max(a.daily[k] || 0, b.daily[k] || 0);  // learning seconds per day
  m.resume = ((a.resume?.t || 0) >= (b.resume?.t || 0)) ? a.resume : b.resume;          // most recent resume point
  return m;
}
const totalSecs = () => Object.values(S.daily).reduce((x, y) => x + y, 0);
function streak() {
  const d = new Date(); if (!(S.daily[dayKey(d)] > 0)) d.setDate(d.getDate() - 1);
  let n = 0; while (S.daily[dayKey(d)] > 0) { n++; d.setDate(d.getDate() - 1); } return n;
}
function currentLevel() { for (let n = 1; n <= TOTAL_LEVELS; n++) if (!S.completed[n]) return n; return TOTAL_LEVELS; }
function levelStatus(n) { if (S.completed[n]) return 'done'; if (n === currentLevel()) return C[n] ? 'cur' : 'soon'; return n > CONTENT_MAX && n < currentLevel() ? 'soon' : 'lock'; }

// =====================================================================
// 6. SUPABASE: LOGIN + CLOUD SYNC
// =====================================================================
const configured = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_KEY.includes('YOUR-');
let db = null;   // created in boot() once the Supabase library has loaded
let S = blank(), user = null, mode = 'auth', LS = null, Q = null;
let saveTimer = null, pushing = false, pendingSync = false;

const lsKey = () => 'cppmaster_' + user.id;
function saveLocal() { try { localStorage.setItem(lsKey(), JSON.stringify(S)); } catch (e) {} }
function loadLocal() { try { return JSON.parse(localStorage.getItem(lsKey()) || 'null'); } catch (e) { return null; } }
function setSync(s) { $('sync').textContent = { ok: '☁ Synced', saving: '⟳ Saving…', offline: '⚠ Offline – will sync later', err: '⚠ Sync problem – retrying' }[s] || ''; }
function scheduleSave(now) { if (!user) return; saveLocal(); clearTimeout(saveTimer); saveTimer = setTimeout(cloudPush, now ? 0 : 1500); }

async function cloudPush() {
  if (!user) return;
  if (pushing) { pendingSync = true; return; }
  if (!navigator.onLine) { pendingSync = true; setSync('offline'); return; }
  pushing = true; pendingSync = false; setSync('saving'); let failed = false;
  try {
    // Read the cloud copy first and merge, so we never overwrite newer progress from another device
    const { data, error } = await db.from('learner_state').select('data').eq('user_id', user.id).maybeSingle();
    if (error) throw error;
    if (data && data.data) S = merge(S, data.data);
    const res = await db.from('learner_state').upsert({ user_id: user.id, data: S, updated_at: new Date().toISOString() });
    if (res.error) throw res.error;
    saveLocal(); setSync('ok');
  } catch (e) { console.error('Sync failed:', e); failed = true; pendingSync = true; setSync(navigator.onLine ? 'err' : 'offline'); }
  finally { pushing = false; if (pendingSync && navigator.onLine) setTimeout(cloudPush, failed ? 15000 : 500); }
}
window.addEventListener('online', () => user && cloudPush());
document.addEventListener('visibilitychange', async () => { if (!document.hidden && user && !pushing) { await cloudPush(); if (mode === 'dash') renderDash(); } });

async function onUser(u) {
  user = u; $('logoutBtn').classList.toggle('hidden', !u);
  if (!u) { S = blank(); setSync(''); renderAuth(); return; }
  S = normState(loadLocal());
  if (recovering) renderNewPassword(); else renderDash();   // show cached progress instantly
  await cloudPush();                                   // then merge with the cloud copy
  if (mode === 'dash') renderDash();
}
async function logout() { await cloudPush(); await db.auth.signOut(); }

function renderAuth(msg = '', cls = '') {
  mode = 'auth';
  main.innerHTML = `<div class="card" style="max-width:420px;margin:30px auto">
    <h1>Learn C++ in 12 weeks</h1>
    <p class="muted">30 minutes a day: 15 min learning + a 15-question quiz. Log in to save your progress across devices.</p>
    ${configured ? `
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="password">Password (at least 6 characters)</label><input id="password" type="password" autocomplete="current-password">
    <button class="full" onclick="login()">Log in</button>

    `<p class="err">Supabase is not set up yet. Open index.html and paste your Project URL and publishable key at the top of the script.</p>`}
    <div id="authMsg" class="msg ${cls}">${esc(msg)}</div></div>`;
}
const netHelp = m => /fetch|network|load failed/i.test(m)
  ? m + ' — the browser could not reach Supabase. An ad blocker, privacy extension or strict tracking protection may be blocking supabase.co. Turn it off for this site and try again.'
  : m;
async function login() {

// ----- Forgot password: email a reset link, then let the user choose a new password -----
let recovering = /type=recovery/.test(location.hash);   // true when the user arrives from the reset email
async function forgotPassword() {
  const email = $('email').value.trim(), el = $('authMsg');
  if (!email) { el.className = 'msg err'; el.textContent = 'Type your email address above first, then click "Forgot password?" again.'; return; }
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) { el.className = 'msg err'; el.textContent = netHelp(error.message); return; }

function renderNewPassword(msg = '', cls = '') {
  mode = 'reset';
  main.innerHTML = `<div class="card" style="max-width:420px;margin:30px auto">
    <h1>Choose a new password</h1><p class="muted">For ${esc(user ? user.email : '')}</p>

async function saveNewPassword() {
  const p1 = $('pw1').value, p2 = $('pw2').value;

function clearWrong() { S.wrongCleared = Date.now(); S.wrong = []; scheduleSave(true); renderDash(); }
function continueLearning() {
  const r = S.resume && !S.resume.done && C[S.resume.n] ? S.resume : null;
  openLevel(r ? r.n : currentLevel());
}

// =====================================================================
// 8. LEARNING SESSION (flashcards → typing exercises → quiz)
// =====================================================================
function openLevel(n) {
  if (!C[n]) return;
  const r = S.resume;
  LS = (r && !r.done && r.n === n) ? { n, phase: r.phase, idx: r.idx || 0, ls: r.ls || 0 } : { n, phase: 'cards', idx: 0, ls: 0 };
  LS.flip = false; LS.fb = null; LS.given = '';
  saveResume(); renderLearn();
}
function saveResume() { S.resume = { t: Date.now(), n: LS.n, phase: LS.phase, idx: LS.idx, ls: LS.ls }; scheduleSave(); }

function renderLearn() {
  mode = 'learn';
  const L = C[LS.n], total = L.cards.length + L.typing.length;
  const step = LS.phase === 'cards' ? LS.idx : LS.phase === 'type' ? L.cards.length + LS.idx : total;
  let body = '';
  if (LS.phase === 'cards') {
    const c = L.cards[LS.idx];
    body = `<div class="muted">Flashcard ${LS.idx + 1} of ${L.cards.length} · tap the card to flip</div>
      <div class="flash ${LS.flip ? 'back' : ''}" onclick="flipCard()">
        ${LS.flip ? `<div class="tag">Answer</div><div class="txt">${esc(c.b)}</div>${codeBlock(c.code)}`
                  : `<div class="tag">Concept</div><div class="front">${esc(c.f)}</div>${codeBlock(c.fcode)}`}
      </div>
      <div class="row"><button class="sec" onclick="cardMove(-1)" ${LS.idx === 0 ? 'disabled' : ''}>← Back</button>
      <button onclick="cardMove(1)">${LS.idx === L.cards.length - 1 ? 'Start typing practice →' : 'Next →'}</button></div>`;
  } else if (LS.phase === 'type') {
    const x = L.typing[LS.idx];
    body = `<div class="muted">Typing practice ${LS.idx + 1} of ${L.typing.length}</div>
      <p><b>${esc(x.p)}</b></p>${codeBlock(x.code)}
      ${answerInput(LS.fb !== null, LS.given, LS.fb !== null ? 'learnNext()' : 'checkTyping()')}
      ${LS.fb !== null ? fbHtml(LS.fb, x) + `<button class="full" onclick="learnNext()">${LS.idx === L.typing.length - 1 ? 'Finish practice →' : 'Next →'}</button>`
                       : `<button class="full" onclick="checkTyping()">Check answer</button>`}`;
  } else {
    body = `<div style="text-align:center;padding:20px 0"><div class="big">🎯</div><h2>Learning done – quiz time!</h2>
      <p class="muted">${QUIZ_N} questions on Level ${LS.n}. Score ${PASS}% or more to unlock the next level.</p>
      <button onclick="startQuiz(${LS.n})">Start the quiz</button>
      <div class="row"><button class="sec" onclick="LS.phase='cards';LS.idx=0;LS.flip=false;saveResume();renderLearn()">Review the flashcards again</button></div></div>`;
  }
  main.innerHTML = `<div class="card">
    <div class="top"><button class="sec small" onclick="renderDash()">← Dashboard</button>
      <span>⏱ <span class="timer" id="ltimer">${learnTimerText()}</span></span></div>
    <h2 style="margin-top:12px">Level ${LS.n} · ${esc(LEVELS[LS.n - 1])}</h2>
    <div class="progress"><div style="width:${step / total * 100}%"></div></div>
    <div style="margin-top:14px">${body}</div></div>`;
  focusAnswer();
}
const learnTimerText = () => LS.ls >= LEARN_SECS ? '15:00 done ✓' : mmss(LEARN_SECS - LS.ls) + ' left';
function flipCard() { LS.flip = !LS.flip; renderLearn(); }
function cardMove(d) {
  const L = C[LS.n]; LS.flip = false;
  if (d > 0 && LS.idx === L.cards.length - 1) { LS.phase = 'type'; LS.idx = 0; LS.fb = null; LS.given = ''; }
  else LS.idx = Math.max(0, LS.idx + d);
  saveResume(); renderLearn();
}
function checkTyping() {
  const x = C[LS.n].typing[LS.idx]; LS.given = $('ans').value;
  if (!LS.given.trim()) return;
  LS.fb = isRight(LS.given, x); beep(LS.fb); renderLearn();
}
function learnNext() {
  const L = C[LS.n]; LS.fb = null; LS.given = '';
  if (LS.idx === L.typing.length - 1) LS.phase = 'ready'; else LS.idx++;
  saveResume(); renderLearn();
}

// ----- answer checking -----
function norm(s, m) {
  s = String(s).replace(/[“”„]/g, '"').replace(/[‘’]/g, "'").trim();        // phone keyboards use "smart" quotes
  if (m === 'out') return s.replace(/\s+/g, ' ');                              // program output: spacing matters
  if (m === 'word') return s.replace(/\s+/g, ' ').toLowerCase().replace(/[.!]$/, '');
  return s.replace(/\s+/g, '');                                                 // code: ignore spaces, keep case
}
const isRight = (input, item) => item.a.some(a => norm(a, item.m) === norm(input, item.m));
const correctText = item => item.type === 'mcq' ? item.o[0] : item.a[0];
function answerInput(disabled, value, onEnter) {
  return `<input id="ans" class="mono" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
    placeholder="Type your answer" value="${esc(value)}" ${disabled ? 'disabled' : ''}
    onkeydown="if(event.key==='Enter'){event.preventDefault();${onEnter}}">`;
}
function focusAnswer() { setTimeout(() => { const a = $('ans'); if (a && !a.disabled) a.focus(); }, 0); }
function fbHtml(ok, item) {
  return `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? '✅ Correct!' : '❌ Not quite.'}</b>
    ${ok ? '' : `<div style="margin-top:6px">Correct answer: <code>${esc(correctText(item))}</code></div>`}
    <div style="margin-top:6px">${esc(item.e)}</div></div>`;
}

// ----- sound effects (generated in the browser, no files needed) -----
let actx = null;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [[660, 0], [880, .12]] : [[200, 0], [150, .16]];
    notes.forEach(([f, t]) => {
      const o = actx.createOscillator(), g = actx.createGain(), s = actx.currentTime + t;
      o.type = ok ? 'sine' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.25, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.2);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s + 0.22);
    });
  } catch (e) {}
}

// =====================================================================
// 9. QUIZ (15 questions, unseen questions first, shuffled options)
// =====================================================================
function buildQuiz(n) {
  const L = C[n];
  const pool = [...L.mcq.map((x, i) => ({ ...x, id: `L${n}-m${i}` })), ...L.typed.map((x, i) => ({ ...x, id: `L${n}-t${i}` }))];
  let hist = S.seen[n] || { r: 0, ids: [] };
  let unseen = pool.filter(x => !hist.ids.includes(x.id));
  if (!unseen.length) { hist = { r: hist.r + 1, ids: [] }; S.seen[n] = hist; unseen = pool; }   // bank used up → start a new round
  const nStatic = QUIZ_N - GEN_N;
  let chosen = shuffle(unseen).slice(0, nStatic);
  if (chosen.length < nStatic) chosen = chosen.concat(shuffle(pool.filter(x => !chosen.includes(x))).slice(0, nStatic - chosen.length));
  const gi = shuffle(L.gens.map((_, i) => i)); const gen = [];
  for (let i = 0; i < GEN_N; i++) { const k = gi[i % gi.length]; gen.push({ ...L.gens[k](), id: `L${n}-g${k}` }); }
  return shuffle([...chosen, ...gen]).map(q => q.type === 'mcq' ? { ...q, shown: shuffle(q.o) } : q);
}
function startQuiz(n) {
  if (LS && LS.n === n) { LS.phase = 'ready'; saveResume(); }
  Q = { n, items: buildQuiz(n), i: 0, res: [], start: Date.now(), answered: false, choice: null, given: '' };
  renderQuiz();
}
function renderQuiz() {
  mode = 'quiz'; window.scrollTo(0, 0);
  const q = Q.items[Q.i], ok = Q.answered ? Q.res[Q.i].ok : null;
  let answer = '';
  if (q.type === 'mcq') {
    answer = q.shown.map((o, i) => {
      let cls = '';
      if (Q.answered) { if (o === q.o[0]) cls = 'right'; else if (i === Q.choice) cls = 'wrong'; }
      return `<button class="opt ${cls}" ${Q.answered ? 'disabled' : `onclick="answerMCQ(${i})"`}><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
    }).join('');
  } else {
    answer = answerInput(Q.answered, Q.given, Q.answered ? 'quizNext()' : 'answerTyped()') + (Q.answered ? '' : `<button class="full" onclick="answerTyped()">Submit answer</button>`);
  }
  const score = Q.res.filter(r => r.ok).length;
  main.innerHTML = `<div class="card">
    <div class="top"><button class="sec small" onclick="quitQuiz()">✕ Quit quiz</button>
      <span>⏱ <span class="timer" id="qclock">${mmss((Date.now() - Q.start) / 1000)}</span> · Score ${score}/${Q.res.length}</span></div>
    <h2 style="margin-top:12px">Level ${Q.n} quiz · Question ${Q.i + 1} of ${QUIZ_N}</h2>
    <div class="progress"><div style="width:${Q.i / QUIZ_N * 100}%"></div></div>
    <p style="margin-top:16px"><b>${esc(q.q)}</b></p>${codeBlock(q.code)}
    ${answer}
    ${Q.answered ? fbHtml(ok, q) + `<button class="full" onclick="quizNext()">${Q.i === QUIZ_N - 1 ? 'See my results →' : 'Next question →'}</button>` : ''}
  </div>`;
  focusAnswer();
}
function answerMCQ(i) { const q = Q.items[Q.i]; Q.choice = i; record(q.shown[i] === q.o[0], q.shown[i]); }
function answerTyped() { const v = $('ans').value; if (!v.trim()) return; Q.given = v; record(isRight(v, Q.items[Q.i]), v); }
function record(ok, given) { Q.res[Q.i] = { ok, given }; Q.answered = true; beep(ok); renderQuiz(); }
function quizNext() {
  if (Q.i === QUIZ_N - 1) return finishQuiz();
  Q.i++; Q.answered = false; Q.choice = null; Q.given = ''; renderQuiz();
}
function quitQuiz() { if (confirm('Quit this quiz? Your answers so far will not be saved.')) { Q = null; renderDash(); } }

function finishQuiz() {
  const n = Q.n, correct = Q.res.filter(r => r.ok).length, pct = Math.round(correct / QUIZ_N * 100);
  const secs = Math.round((Date.now() - Q.start) / 1000), now = Date.now();
  const weak = [...new Set(Q.items.filter((q, i) => !Q.res[i].ok).map(q => q.tp))];
  const att = { id: now.toString(36) + Math.random().toString(36).slice(2, 7), n, d: now, c: correct, t: QUIZ_N, p: pct, s: secs, w: weak };
  S.attempts.push(att);
  S.best[n] = Math.max(S.best[n] ?? 0, pct);
  if (pct >= PASS) S.completed[n] = true;
  const hist = S.seen[n] || { r: 0, ids: [] };                    // remember which bank questions were used
  hist.ids = [...new Set([...hist.ids, ...Q.items.filter(q => !q.id.includes('-g')).map(q => q.id)])];
  S.seen[n] = hist;
  Q.items.forEach((q, i) => { if (!Q.res[i].ok) S.wrong.push({ id: q.id, d: now + i, n, q: q.q, code: q.code || '', ans: correctText(q), given: Q.res[i].given, e: q.e }); });
  S.wrong = S.wrong.slice(-50);
  S.resume = { t: now, n, done: true };
  scheduleSave(true);
  renderResults(att);
}
function renderResults(a) {
  mode = 'results'; window.scrollTo(0, 0);
  const passed = a.p >= PASS, next = a.n + 1;
  main.innerHTML = `<div class="card" style="text-align:center">
    <div style="font-size:40px">${passed ? '🎉' : '💪'}</div>
    <div class="big" style="color:${passed ? 'var(--green)' : 'var(--red)'}">${a.p}%</div>
    <h2>${passed ? `Level ${a.n} complete!` : `You need ${PASS}% to pass – try again!`}</h2>
    <div class="grid" style="text-align:left">
      <div class="stat"><div class="n">${a.t}</div><div class="l">Questions answered</div></div>
      <div class="stat"><div class="n" style="color:var(--green)">${a.c}</div><div class="l">Correct</div></div>
      <div class="stat"><div class="n" style="color:var(--red)">${a.t - a.c}</div><div class="l">Incorrect</div></div>
      <div class="stat"><div class="n">${a.c}/${a.t}</div><div class="l">Score</div></div>
      <div class="stat"><div class="n">${mmss(a.s)}</div><div class="l">Time taken</div></div>
    </div>
    <div style="text-align:left"><h3>Topics to improve</h3>${a.w.length ? a.w.map(w => `<span class="chip">${esc(w)}</span>`).join('') : '<span class="muted">None – perfect score! 🌟</span>'}</div>
    <div class="row">
      <button class="sec" onclick="startQuiz(${a.n})">Retry quiz (new questions)</button>
      ${passed && C[next] ? `<button onclick="openLevel(${next})">Next: Level ${next} →</button>` : `<button onclick="renderDash()">Back to dashboard</button>`}
    </div>
    ${passed && !C[next] && next <= TOTAL_LEVELS ? `<p class="muted">Level ${next} content is coming soon.</p>` : ''}
  </div>`;
}

// =====================================================================
// 10. LEARNING-TIME TRACKER (counts only while learning or in a quiz)
// =====================================================================
let tick = 0;
setInterval(() => {
  if (!user || document.hidden || (mode !== 'learn' && mode !== 'quiz')) return;
  const d = today(); S.daily[d] = (S.daily[d] || 0) + 1; tick++;
  if (mode === 'learn' && LS) { LS.ls++; const el = $('ltimer'); if (el) el.textContent = learnTimerText(); if (tick % 15 === 0) saveResume(); }
  if (mode === 'quiz' && Q) { const el = $('qclock'); if (el) el.textContent = mmss((Date.now() - Q.start) / 1000); }
  if (tick % 30 === 0) scheduleSave();
}, 1000);

// =====================================================================
// 11. START
// =====================================================================
// Show any unexpected error on the page instead of leaving it blank
function showFatal(title, detail) {
  main.innerHTML = `<div class="card" style="max-width:520px;margin:30px auto"><h2>⚠ ${esc(title)}</h2>
    <p>${detail}</p><button class="full" onclick="location.reload()">Reload the page</button></div>`;
}
window.addEventListener('error', e => { if (!user && mode === 'auth' && !$('email')) showFatal('Something went wrong', 'Error: <code>' + esc(e.message) + '</code><br>Please send this message to get help.'); });

const BLOCKED_HELP = `The login library could not be downloaded. This usually means an <b>ad blocker or privacy extension</b>
  (for example uBlock Origin, AdBlock, Privacy Badger or Ghostery) or a strict privacy setting is blocking it.<br><br>
  Try: (1) turn off the ad blocker for this site, (2) in Firefox, click the shield icon in the address bar and turn off
  Enhanced Tracking Protection for this site, or (3) open the site in a private/incognito window.`;

function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}
async function boot() {
  if (!configured) return renderAuth();
  if (typeof supabase === 'undefined') {                       // first server blocked → try a second one
    main.innerHTML = '<div class="card">Loading…</div>';
    try { await loadScript('https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'); } catch (e) {}
  }
  if (typeof supabase === 'undefined') return showFatal('Could not load the website', BLOCKED_HELP);
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  renderAuth();
  db.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { recovering = true; if (user) setTimeout(() => renderNewPassword(), 0); }
    const u = session ? session.user : null;
    if ((u && u.id) === (user && user.id)) return;
    setTimeout(() => onUser(u), 0);
  });
}
boot();
</script>
